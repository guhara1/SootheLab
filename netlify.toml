# 간다GO 경기북부 · Netlify 배포 설정
# 정적 생성기이므로 build.js로 dist/를 생성해 게시한다.

[build]
  command = "node build.js"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# 루트 접속 → 경기북부 메인으로 (SEO 301)
[[redirects]]
  from = "/"
  to = "/gyeonggi-north/"
  status = 301
  force = true

# 정적 자산 캐시
[[headers]]
  for = "/gyeonggi-north/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
