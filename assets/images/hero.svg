  <rect width="1600" height="680" fill="url(#bg)"/>
  <rect width="1600" height="680" fill="url(#glow)"/>
  <rect y="0" width="1600" height="6" fill="#c9a24b"/>
  <text x="800" y="320" font-family="Pretendard, sans-serif" font-size="62" font-weight="800" fill="#ffffff" text-anchor="middle">간다GO 경기북부</text>
  <text x="800" y="400" font-family="Pretendard, sans-serif" font-size="34" font-weight="600" fill="#ffb37a" text-anchor="middle">이미지 자리 · assets/images/hero.jpg 업로드 시 자동 교체</text>
  <text x="800" y="470" font-family="Pretendard, sans-serif" font-size="26" fill="#c2b6aa" text-anchor="middle">권장 비율 16:7 (예: 1600×700)</text>
