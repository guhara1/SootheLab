<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 680" role="img" aria-label="간다GO 경기북부 안내 이미지 자리">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#241d17"/>
      <stop offset="0.55" stop-color="#2f2823"/>
      <stop offset="1" stop-color="#1c1712"/>
    </linearGradient>
    <radialGradient id="glow" cx="80%" cy="12%" r="60%">
      <stop offset="0" stop-color="#f26b1d" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#f26b1d" stop-opacity="0"/>
